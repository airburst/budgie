<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="1350" viewBox="0 0 1510 1350" role="img" aria-labelledby="title desc">
  <title id="title">Budgie phase 5: drawer states and desktop subgrid cards</title>
  <desc id="desc">Two phone wireframes show transaction details without a keyboard and explicit editing above a simulated keyboard. A desktop layout retains sidebar and centered dialogs, with aligned compact record cards.</desc>
  <defs>
    <style>
      text{font-family:Arial,sans-serif;fill:#f4f4f5;font-size:14px}.sub{fill:#b4b4bd;font-size:13px}.label{fill:#b4b4bd;font-size:11px;letter-spacing:.5px}.money{font-variant-numeric:tabular-nums;font-weight:700}.blue{fill:#92b9ff}.green{fill:#70d6ac}.red{fill:#ff999f}.card{fill:#242428;stroke:#414148}.line{stroke:#414148}.note{fill:#364152;font-size:14px}.caption{fill:#172033;font-size:18px;font-weight:700}.btn{fill:#315fe3}
    </style>
  </defs>
  <rect width="1510" height="1350" fill="#edf0f5"/>
  <text x="40" y="42" class="caption">03 / Read first. Edit deliberately. Keep desktop density.</text>
  <text x="40" y="68" class="note">PROPOSAL · simulated keyboard illustrates the acceptance target, not verified device behavior</text>
  <g transform="translate(40 110)">
    <rect width="390" height="680" rx="24" fill="#121215" stroke="#51515b"/>
    <text x="20" y="27" class="sub">9:41</text><text x="310" y="27" class="sub">5G  100%</text>
    <text x="16" y="71" font-size="23" font-weight="700" opacity=".3">Transactions</text>
    <rect x="16" y="100" width="358" height="110" rx="12" class="card" opacity=".3"/>
    <rect x="16" y="226" width="358" height="90" rx="12" class="card" opacity=".2"/>
    <path d="M0 267Q0 243 24 243H366Q390 243 390 267V656Q390 680 366 680H24Q0 680 0 656Z" fill="#242428" stroke="#51515b"/>
    <rect x="172" y="255" width="46" height="5" rx="3" fill="#71717a"/>
    <text x="16" y="300" font-size="21" font-weight="700">Transaction details</text><text x="344" y="300">✕</text>
    <text x="16" y="341" font-size="18" font-weight="700">Supermarket</text><text x="374" y="341" text-anchor="end" font-size="23" class="money red">−£42.80</text>
    <text x="16" y="373" class="sub">Current Account · Cleared</text><line x1="16" y1="393" x2="374" y2="393" class="line"/>
    <text x="16" y="425" class="sub">Date</text><text x="374" y="425" text-anchor="end">17 October 2026</text>
    <text x="16" y="461" class="sub">Category</text><text x="374" y="461" text-anchor="end">Groceries</text>
    <text x="16" y="497" class="sub">Notes</text><text x="16" y="525">Weekly shop and household essentials.</text>
    <text x="16" y="563" class="blue">More actions: Mark uncleared / Delete</text>
    <line x1="0" y1="584" x2="390" y2="584" class="line"/>
    <rect x="16" y="600" width="175" height="48" rx="9" fill="#303038"/><text x="103" y="630" text-anchor="middle">Close</text>
    <rect x="199" y="600" width="175" height="48" rx="9" class="btn"/><text x="286" y="630" text-anchor="middle">Edit</text>
    <rect x="137" y="662" width="116" height="4" rx="2" fill="#71717a"/>
  </g>
  <g transform="translate(470 110)">
    <rect width="390" height="680" rx="24" fill="#121215" stroke="#51515b"/>
    <text x="20" y="27" class="sub">9:41</text><text x="310" y="27" class="sub">5G  100%</text>
    <path d="M0 61Q0 42 24 42H366Q390 42 390 61V680H0Z" fill="#242428"/>
    <rect x="172" y="52" width="46" height="5" rx="3" fill="#71717a"/>
    <text x="16" y="94" font-size="21" font-weight="700">Edit transaction</text><text x="344" y="94">✕</text>
    <text x="16" y="124" class="sub">Current Account</text><path d="M0 142H390" class="line"/>
    <text x="16" y="170" class="sub">Date</text><rect x="16" y="180" width="358" height="44" rx="8" fill="#17171b" stroke="#51515b"/><text x="30" y="208">17 October 2026</text>
    <text x="16" y="253" class="sub">Payee</text><rect x="16" y="263" width="358" height="44" rx="8" fill="#17171b" stroke="#51515b"/><text x="30" y="291">Supermarket</text>
    <text x="16" y="336" class="sub">Withdrawal</text><rect x="16" y="346" width="358" height="44" rx="8" fill="#17171b" stroke="#92b9ff" stroke-width="2"/><text x="30" y="374">42.80│</text>
    <text x="16" y="413" class="sub">Scroll form for category, deposit, notes, cleared</text>
    <path d="M0 429H390" class="line"/>
    <rect x="16" y="441" width="175" height="48" rx="9" fill="#303038"/><text x="103" y="471" text-anchor="middle">Cancel</text>
    <rect x="199" y="441" width="175" height="48" rx="9" class="btn"/><text x="286" y="471" text-anchor="middle">Save changes</text>
    <rect y="501" width="390" height="179" fill="#39393f"/>
    <text x="195" y="529" text-anchor="middle" class="label">SIMULATED OS NUMERIC KEYBOARD</text>
    <rect x="10" y="543" width="116" height="32" rx="6" fill="#55555d"/><rect x="137" y="543" width="116" height="32" rx="6" fill="#55555d"/><rect x="264" y="543" width="116" height="32" rx="6" fill="#55555d"/>
    <text x="68" y="565" text-anchor="middle">1</text><text x="195" y="565" text-anchor="middle">2</text><text x="322" y="565" text-anchor="middle">3</text>
    <rect x="10" y="583" width="116" height="32" rx="6" fill="#55555d"/><rect x="137" y="583" width="116" height="32" rx="6" fill="#55555d"/><rect x="264" y="583" width="116" height="32" rx="6" fill="#55555d"/>
    <text x="68" y="605" text-anchor="middle">4</text><text x="195" y="605" text-anchor="middle">5</text><text x="322" y="605" text-anchor="middle">6</text>
    <text x="68" y="645" text-anchor="middle">7</text><text x="195" y="645" text-anchor="middle">8</text><text x="322" y="645" text-anchor="middle">9</text>
    <rect x="137" y="662" width="116" height="4" rx="2" fill="#b4b4bd"/>
  </g>
  <g transform="translate(900 130)">
    <text x="0" y="0" class="caption">G. Details → Edit → explicit input tap</text>
    <text x="0" y="38" class="note">1. Open read-only details. Keyboard stays closed.</text>
    <text x="0" y="70" class="note">2. Edit enters the expanded form without autofocus.</text>
    <text x="0" y="102" class="note">3. Input tap opens keyboard; actions remain visible.</text>
    <text x="0" y="154" class="caption">Required behavior, not styling polish</text>
    <text x="0" y="192" class="note">• Header and footer do not scroll with the fields.</text>
    <text x="0" y="224" class="note">• Dirty swipe / Close asks before discarding.</text>
    <text x="0" y="256" class="note">• Failed save retains draft and visible error.</text>
    <text x="0" y="288" class="note">• Rotation keeps the same draft and open state.</text>
    <text x="0" y="320" class="note">• Date / category pickers stay inside focus scope.</text>
    <text x="0" y="352" class="note">• Reconciled details have no Edit / Delete action.</text>
    <text x="0" y="404" class="caption">H. Desktop and tablet</text>
    <text x="0" y="442" class="note">768px+: top navigation; centered dialog if tall enough.</text>
    <text x="0" y="474" class="note">1024px+: sidebar and compact subgrid record cards.</text>
    <text x="0" y="506" class="note">Tablet portrait keeps a single main column.</text>
    <text x="0" y="538" class="note">Short landscape favors an expanded editor.</text>
    <text x="0" y="590" class="note">Use official shadcn Base UI Drawer, not a DIY swipe.</text>
    <text x="0" y="622" class="note">Real iOS / Android keyboard tests gate rollout.</text>
  </g>
  <g transform="translate(40 850)">
    <rect width="1430" height="366" rx="14" fill="#121215" stroke="#51515b"/>
    <path d="M0 51H1430" class="line"/><text x="24" y="32" font-weight="700">Budgie</text>
    <text x="475" y="32" class="blue">Accounts</text><text x="583" y="32">Subscriptions</text><text x="724" y="32">Budget</text><text x="814" y="32">Reports</text><text x="1320" y="32">Settings</text>
    <rect y="52" width="230" height="314" fill="#1d1d21"/>
    <text x="20" y="83" class="label">ACCOUNTS</text>
    <rect x="12" y="101" width="206" height="56" rx="8" fill="#283756"/><text x="24" y="124">Current Account</text><text x="24" y="146" class="sub">£4,285.60</text>
    <text x="24" y="192">Savings</text><text x="24" y="216" class="sub">£5,000.00</text>
    <text x="24" y="259">Credit Card</text><text x="24" y="283" class="sub">−£1,250.00</text>
    <text x="24" y="341" class="blue">+ Add account</text>
    <text x="254" y="92" font-size="23" font-weight="700">Current Account / Transactions</text><text x="254" y="119" class="sub">Balance £4,285.60 · Cleared £4,210.60</text>
    <rect x="1130" y="70" width="134" height="36" rx="8" class="btn"/><text x="1197" y="94" text-anchor="middle">+ Add transaction</text><text x="1294" y="94" class="blue">More •••</text>
    <text x="270" y="161" class="label">DATE</text><text x="384" y="161" class="label">PAYEE</text><text x="641" y="161" class="label">CATEGORY</text><text x="900" y="161" text-anchor="end" class="label">AMOUNT</text><text x="1058" y="161" text-anchor="end" class="label">BALANCE</text><text x="1112" y="161" class="label">STATUS</text>
    <rect x="254" y="176" width="1152" height="48" rx="8" class="card"/>
    <text x="270" y="206">17 Oct</text><text x="384" y="206">Supermarket</text><text x="641" y="206" class="sub">Groceries</text><text x="900" y="206" text-anchor="end" class="money red">−£42.80</text><text x="1058" y="206" text-anchor="end" class="sub">—</text><text x="1112" y="206" class="sub">Cleared</text><text x="1302" y="206" class="blue">Details</text>
    <rect x="254" y="234" width="1152" height="48" rx="8" class="card"/>
    <text x="270" y="264">17 Oct</text><text x="384" y="264">Salary</text><text x="641" y="264" class="sub">Income</text><text x="900" y="264" text-anchor="end" class="money green">+£2,850.00</text><text x="1058" y="264" text-anchor="end" class="sub">—</text><text x="1112" y="264" class="sub">Cleared</text><text x="1302" y="264" class="blue">Details</text>
    <rect x="254" y="292" width="1152" height="48" rx="8" class="card"/>
    <text x="270" y="322">17 Oct</text><text x="384" y="322">Coffee shop</text><text x="641" y="322" class="sub">Eating out</text><text x="900" y="322" text-anchor="end" class="money red">−£4.50</text><text x="1058" y="322" text-anchor="end" class="sub">—</text><text x="1112" y="322" class="sub">Cleared</text><text x="1302" y="322" class="blue">Details</text>
  </g>
  <text x="40" y="1256" class="caption">I. Desktop keeps column comparison without tall phone-style tiles</text>
  <text x="40" y="1285" class="note">Shared parent grid → each card uses subgrid. Signed amount replaces separate In / Out columns. Notes remain in details. Existing sort/state logic is retained.</text>
  <text x="40" y="1317" class="note">Review D2 and D5-D6 in PHASE5_UX_PLAN.md · Centered desktop dialogs remain; the account sidebar is not forced onto tablet portrait.</text>
</svg>
