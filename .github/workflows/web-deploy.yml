name: Web Deploy

on:
  pull_request:
  push:
    branches:
      - web-platform
    tags:
      - "v*"

permissions:
  contents: read

env:
  CLOUDFLARE_PAGES_PROJECT: budgie-web

jobs:
  build-web-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run verify:web
      - uses: actions/upload-artifact@v4
        with:
          name: budgie-web-${{ github.sha }}
          path: build
          retention-days: 30

  deploy-preview:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/web-platform') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: build-web-artifact
    runs-on: ubuntu-latest
    environment: preview
    concurrency:
      group: web-preview-${{ github.event_name == 'push' && 'web-platform' || github.event.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: budgie-web-${{ github.sha }}
          path: build
      - name: Deploy Cloudflare Pages preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.event_name == 'push' && 'web-platform' || format('pr-{0}', github.event.number) }}

  deploy-production:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-web-artifact
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: web-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: budgie-web-${{ github.sha }}
          path: build
      - name: Deploy Cloudflare Pages production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=main
